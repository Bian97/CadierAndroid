apply plugin: 'com.android.application'

// x-api-key do backend novo - lida do local.properties (gitignored, ver comentário lá) em vez de
// hardcoded no código-fonte, pra não commitar o segredo real no repositório.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    compileSdk 36
    defaultConfig {
        applicationId "app.convencao.cadier"
        minSdkVersion 21
        targetSdk 36
        versionCode 19
        versionName '1.0.10'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_KEY", "\"${localProperties.getProperty('apiKey', '')}\""
    }
    buildFeatures {
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace = 'app.convencao.cadier'
    buildToolsVersion '36.1.0'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //noinspection GradleCompatible
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.test:monitor:1.8.0'
    implementation 'androidx.test.ext:junit:1.3.0'

    implementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.picasso:picasso:2.71828'

    // Recorte de imagem (Foto 3x4, aspecto 3:4 + rotação) - via JitPack, já configurado no
    // build.gradle raiz. Evita reimplementar a matemática de crop/zoom/limites do zero.
    implementation 'com.github.yalantis:ucrop:2.2.6'
}
